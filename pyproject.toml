[project]
name = "kbeval"
version = "0.1.0"
description = "Eval harness measuring how knowledge organization affects LLM factual fidelity"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Nikodem Malinowski" }]

# Zależności dokładasz w miarę budowania ramion — nie deklaruj na zapas.
# Planowane:
#   A0 (RAG):  chromadb, rank-bm25, openai
#   wspólne:   anthropic, pyyaml, pydantic
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kbeval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
